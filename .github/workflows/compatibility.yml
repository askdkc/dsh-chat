name: Current official DSH compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current-dsh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve current official DSH
        run: node scripts/prepare-latest-dsh.mjs
      - name: Select upstream package manager
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./.upstream/package.json').packageManager")" --activate
      - name: Build unmodified official DSH
        working-directory: .upstream
        run: pnpm install --frozen-lockfile && pnpm run build
      - run: npm ci
      - name: Install test browser
        working-directory: .upstream
        # Retry only dependency setup, never a failed acceptance test.
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium --only-shell; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
      - name: Full package, HTTP and browser acceptance
        run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-dsh-revision
          include-hidden-files: true
          path: |
            dsh-revision-evidence.json
            .test-tmp/ci/**/checks.json
            .test-tmp/ci/**/release/
            .test-tmp/ci/**/*.png
