name: Current official DSH compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  current-dsh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve current official DSH
        run: node scripts/prepare-latest-dsh.mjs
      - name: Select upstream package manager
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./.upstream/package.json').packageManager")" --activate
      - name: Build unmodified official DSH
        working-directory: .upstream
        run: pnpm install --frozen-lockfile && pnpm run build
      - run: npm ci
      - run: npm test && npm run test:contract && npm run build && npm run verify:package
      - name: Pack the release candidate once
        run: |
          npm run pack:release
          echo "DSH_TEST_TARBALL=$PWD/.test-tmp/release/$(node -p "require('./package.json').version")/askdkc-dsh-chat-$(node -p "require('./package.json').version").tgz" >> "$GITHUB_ENV"
      - run: npm run test:consumer
      - run: npm run test:http
      - name: Published 0.1.9 negative control
        run: |
          node scripts/fetch-regression-package.mjs
          DSH_TEST_TARBALL="$PWD/.test-tmp/release-negative-control/dsh-chat-0.1.9.tgz" DSH_TEST_EXPECT_LEGACY_FAILURE=1 npm run test:http
      - name: Install test browser
        working-directory: .upstream
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium --only-shell
      - name: Real chat creation, first turn and restart
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-dsh-revision
          include-hidden-files: true
          path: |
            dsh-revision-evidence.json
            .test-tmp/release/
